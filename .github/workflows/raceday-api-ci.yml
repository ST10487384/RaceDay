# Original sources: GitHub Docs - "Understanding GitHub Actions"
# URL: https://docs.github.com/en/actions/about-github-actions/understanding-github-actions
# Supporting sources: actions/checkout, actions/setup-dotnet, and actions/upload-artifact
# URLs: https://github.com/actions/checkout, https://github.com/actions/setup-dotnet, https://github.com/actions/upload-artifact
# Accessed: 14 October 2026
# Adapted for: RaceDay API restore, build, test, and test-result artifact validation.

name: RaceDay API CI

permissions:
  contents: read

concurrency:
  group: raceday-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore ./PROG_API/PROG_API.csproj

      - name: Build API
        run: dotnet build ./PROG_API/PROG_API.csproj --configuration Release --no-restore

      - name: Run API tests
        run: >-
          dotnet test ./PROG_Test/PROG_Test.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=raceday-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceday-api-test-results
          path: TestResults/*.trx
          if-no-files-found: error
