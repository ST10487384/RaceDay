name: RaceDay Full Stack CI

permissions:
  contents: read

concurrency:
  group: raceday-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docs folder
        run: |
          echo "Checking docs folder..."
          ls docs/
          echo "All required files present!"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore ./PROG_API/PROG_API.csproj
          dotnet restore ./PROG_MVC/PROG_MVC.csproj
          dotnet restore ./PROG_Test/PROG_Test.csproj

      - name: Build API, MVC, and Tests
        run: |
          dotnet build ./PROG_API/PROG_API.csproj --configuration Release --no-restore
          dotnet build ./PROG_MVC/PROG_MVC.csproj --configuration Release --no-restore
          dotnet build ./PROG_Test/PROG_Test.csproj --configuration Release --no-restore

      - name: Run API tests
        run: >-
          dotnet test ./PROG_Test/PROG_Test.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=raceday-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceday-api-test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore