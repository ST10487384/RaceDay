name: RaceDay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate docs folder
        run: |
          echo "Checking docs folder..."
          ls docs/
          echo "All required files present!"

      - name: CI Build passed
        run: echo "RaceDay CI build completed successfully!"
